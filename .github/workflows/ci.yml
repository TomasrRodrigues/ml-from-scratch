name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [debug-sanitize, release]
        include:
          - config: debug-sanitize
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DSANITIZE=ON
          - config: release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
    env:
      CC: ${{ matrix.compiler }}
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      # Newer kernels use more ASLR entropy than ASan supports; 28 bits is safe.
      - name: ASan compatibility
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Tool versions
        run: $CC --version && cmake --version && ninja --version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DWARNINGS_AS_ERRORS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure